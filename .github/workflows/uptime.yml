name: Контрольная заявка PRIME SWIM
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: prime-live-check-69f0f2b
  cancel-in-progress: false
jobs:
  live-check:
    if: github.ref == 'refs/heads/codex/prime-live-check-69f0f2b' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Проверка формы и Метрики
        env:
          PRIME_CHECK_LEAD_ENDPOINT: ${{ vars.LEAD_ENDPOINT }}
        run: node scripts/production-check.mjs
