name: Сборка и публикация на GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# Pages разворачивается токеном самого воркфлоу
permissions:
  contents: read
  pages: write
  id-token: write

# параллельные публикации не нужны: важен только последний коммит,
# но начатую публикацию не обрываем, чтобы не оставить Pages в полусостоянии
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # сайт живёт на своём домене, поэтому basePath пустой: адрес репозитория
      # в путях больше не участвует.
      #
      # Основной адрес — с www: он уже известен по прежнему сайту, и ссылки
      # на него терять незачем. Голый primeswim.ru тоже работает: его
      # A-записи ведут на Pages, и оттуда идёт постоянный редирект на www.
      # Канонический адрес должен быть один, иначе поисковик видит два сайта
      # с одинаковым содержимым.
      NEXT_PUBLIC_BASE_PATH: ''
      NEXT_PUBLIC_SITE_URL: https://www.primeswim.ru
      # адрес рабочий, конкурировать в поиске больше не с чем — индексацию включаем
      NEXT_PUBLIC_ALLOW_INDEXING: 'true'
      # номер счётчика Метрики не секрет — он и так виден в исходнике страницы
      NEXT_PUBLIC_YANDEX_METRIKA_ID: '111745879'
      # Адрес приёмника, который принимает заявку и отправляет её ботом в MAX.
      # Задаётся переменной репозитория LEAD_ENDPOINT (Settings → Secrets and
      # variables → Actions → Variables), а не здесь: адрес выдаёт облако при
      # создании приложения, и менять его правкой воркфлоу неудобно.
      #
      # Это НЕ секрет: адрес всё равно виден в исходнике страницы. Секрет —
      # токен бота, и он живёт только в переменных окружения приёмника.
      #
      # Пока переменная пуста, форма показывает честную ошибку и прямые
      # контакты. Ложного «спасибо» посетитель не увидит.
      NEXT_PUBLIC_LEAD_ENDPOINT: ${{ vars.LEAD_ENDPOINT }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Проверка типов
        run: npm run typecheck

      - name: Линтер
        run: npm run lint

      - name: Сборка статики
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
