name: Сборка и публикация на GitHub Pages

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# параллельные публикации не нужны: важен только последний коммит,
# но начатую публикацию не обрываем, чтобы не оставить Pages в полусостоянии
concurrency:
  group: ${{ github.event_name == 'pull_request' && github.ref || 'pages' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    env:
      # сайт живёт на своём домене, поэтому basePath пустой: адрес репозитория
      # в путях больше не участвует.
      #
      # Основной адрес — с www: он уже известен по прежнему сайту, и ссылки
      # на него терять незачем. Голый primeswim.ru тоже работает: его
      # A-записи ведут на Pages, и оттуда идёт постоянный редирект на www.
      # Канонический адрес должен быть один, иначе поисковик видит два сайта
      # с одинаковым содержимым.
      NEXT_PUBLIC_BASE_PATH: ''
      NEXT_PUBLIC_SITE_URL: https://www.primeswim.ru
      # адрес рабочий, конкурировать в поиске больше не с чем — индексацию включаем
      NEXT_PUBLIC_ALLOW_INDEXING: 'true'
      # номер счётчика Метрики не секрет — он и так виден в исходнике страницы
      NEXT_PUBLIC_YANDEX_METRIKA_ID: '111745879'
      # Адрес приёмника, который принимает заявку и отправляет её ботом в MAX.
      # Задаётся переменной репозитория LEAD_ENDPOINT (Settings → Secrets and
      # variables → Actions → Variables), а не здесь: адрес выдаёт облако при
      # создании приложения, и менять его правкой воркфлоу неудобно.
      #
      # Это НЕ секрет: адрес всё равно виден в исходнике страницы. Секрет —
      # токен бота, и он живёт только в переменных окружения приёмника.
      #
      # Пока переменная пуста, форма показывает честную ошибку и прямые
      # контакты. Ложного «спасибо» посетитель не увидит.
      NEXT_PUBLIC_LEAD_ENDPOINT: ${{ vars.LEAD_ENDPOINT }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Проверка типов
        run: npm run typecheck

      - name: Линтер
        run: npm run lint

      # Тесты держат то, от чего зависят заявки: правила проверки формы,
      # приёмник, подбор группы, цены в FAQ. Раньше они шли только локально,
      # и сломанное правило могло уехать на сайт с зелёной сборкой.
      - name: Тесты
        run: npm test

      - name: Сборка статики
        run: npm run build

      - uses: actions/configure-pages@v6
        if: github.ref == 'refs/heads/master'

      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/master'
        with:
          path: out

  deploy:
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Сообщаем Яндексу и Bing об адресах сайта сразу после публикации (IndexNow).
  # Отдельное задание: его сбой не портит саму публикацию, а continue-on-error
  # оставляет прогон зелёным. Повторить вручную: Actions → Run workflow.
  indexnow:
    if: github.ref == 'refs/heads/master'
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      SITE_HOST: www.primeswim.ru
      # ключ не секрет: он лежит в открытом виде в public/<ключ>.txt
      INDEXNOW_KEY: ba7046a3cf6c167008eeed6750ef8b69
    steps:
      - name: Ждём, пока ключ станет доступен на сайте
        run: |
          url="https://${SITE_HOST}/${INDEXNOW_KEY}.txt"
          for i in $(seq 1 30); do
            body=$(curl -fsS --max-time 15 "$url" 2>/dev/null | tr -d '\r\n ' || true)
            if [ "$body" = "$INDEXNOW_KEY" ]; then
              echo "Ключ доступен (попытка $i)"
              exit 0
            fi
            echo "Ключ пока не отдаётся (попытка $i из 30), ждём 20 с"
            sleep 20
          done
          echo "::error::Ключ IndexNow не появился на сайте за 10 минут"
          exit 1

      - name: Отправляем адреса из sitemap.xml в IndexNow
        run: |
          curl -fsS --max-time 30 "https://${SITE_HOST}/sitemap.xml" -o sitemap.xml
          grep -oE '<loc>[^<]+</loc>' sitemap.xml | sed -E 's#</?loc>##g' > urls.txt
          echo "Адресов в sitemap: $(wc -l < urls.txt)"
          test -s urls.txt
          jq -n --arg host "$SITE_HOST" --arg key "$INDEXNOW_KEY"             --arg loc "https://${SITE_HOST}/${INDEXNOW_KEY}.txt"             --rawfile urls urls.txt             '{host: $host, key: $key, keyLocation: $loc, urlList: ($urls | split("\n") | map(select(length > 0)))}' > payload.json
          fail=0
          for endpoint in https://yandex.com/indexnow https://api.indexnow.org/indexnow; do
            code=$(curl -sS --max-time 30 -o response.txt -w '%{http_code}'               -H 'Content-Type: application/json; charset=utf-8'               --data @payload.json "$endpoint" || echo 000)
            echo "$endpoint -> HTTP $code"
            cat response.txt; echo
            if [ "$code" != "200" ] && [ "$code" != "202" ]; then fail=1; fi
          done
          exit $fail
