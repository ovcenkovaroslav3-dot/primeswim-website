name: YAR AI Worker

on:
  issues:
    types: [opened]

permissions:
  contents: write
  pull-requests: write
  issues: read
  actions: read

jobs:
  claude:
    if: startsWith(github.event.issue.title, 'AI TASK:') && !contains(github.event.issue.body, 'Risk: high')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create isolated task branch
        id: branch
        shell: bash
        run: |
          BRANCH="ai/task-${{ github.event.issue.number }}-${{ github.run_id }}"
          git switch -c "$BRANCH"
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            You are the Claude Developer Agent for YAR AI Hub.
            Follow CLAUDE.md and all referenced repository instructions.

            Repository: ${{ github.repository }}
            Project: PRIME SWIM
            Source issue: #${{ github.event.issue.number }}
            Task title: ${{ github.event.issue.title }}

            Structured task:
            ${{ github.event.issue.body }}

            Execute only this task. Never deploy to production. Stop when the acceptance criteria are met and provide the required structured status.
          claude_args: |
            --max-turns 12
            --append-system-prompt "Follow CLAUDE.md and referenced instructions. Prefer minimal changes. Never deploy. Stop when acceptance criteria are met."

      - name: Commit and push changes
        id: push
        shell: bash
        run: |
          git config user.name "yar-ai-hub"
          git config user.email "yar-ai-hub@users.noreply.github.com"

          if git diff --quiet && git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git add -A
          git commit -m "ai: implement task #${{ github.event.issue.number }}"
          git push origin "${{ steps.branch.outputs.name }}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Create pull request
        if: steps.push.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh pr create \
            --base "${{ github.event.repository.default_branch }}" \
            --head "${{ steps.branch.outputs.name }}" \
            --title "AI: ${{ github.event.issue.title }}" \
            --body "Automated implementation from YAR AI Hub.\n\nSource issue: #${{ github.event.issue.number }}\n\nNo production deployment was performed. Review is required before merge."
